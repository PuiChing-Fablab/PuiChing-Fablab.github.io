<svg xmlns="http://www.w3.org/2000/svg" width="18" height="100%" fill="none">
  <!-- No viewBox: caps and grip retain their pixel size as the native thumb grows. -->
  <defs>
    <linearGradient id="alloy" x1="0" x2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#40576c"/>
      <stop offset=".27" stop-color="#172c43"/>
      <stop offset=".5" stop-color="#2b4160"/>
      <stop offset=".78" stop-color="#111d33"/>
      <stop offset="1" stop-color="#53537d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a9ecff"/>
      <stop offset=".5" stop-color="#659ec5"/>
      <stop offset="1" stop-color="#b6a1ee"/>
    </linearGradient>
    <g id="cap">
      <path fill="#050b18" d="M0 0h18v18H0z"/>
      <path d="M7 .75h4l6.25 5v4.5l-2.75 3V18h-11v-4.75l-2.75-3v-4.5Z" fill="url(#alloy)" stroke="url(#edge)" stroke-width=".8"/>
      <path d="m6 4 3-2 3 2-3 2Z" fill="#b8faff"/>
      <path d="M4 7h10M5.5 9h7" stroke="#091221" stroke-width="1.4"/>
      <path d="M4 6.5h10" stroke="#749dbc" stroke-width=".6"/>
      <path d="m1 10 3 3m13-3-3 3" stroke="#050b18" stroke-width="1.5"/>
      <path d="M6 13h6v5H6z" fill="#091528"/>
      <path d="M8 13h2v4H8z" fill="#80dce9" opacity=".65"/>
    </g>
  </defs>
  <!-- Cut away the shoulders of the central energy channel. -->
  <rect width="3" height="100%" fill="#050b18"/>
  <rect x="15" width="3" height="100%" fill="#050b18"/>
  <rect x="3" width="1" height="100%" fill="url(#edge)" opacity=".65"/>
  <rect x="14" width="1" height="100%" fill="url(#edge)" opacity=".65"/>
  <use href="#cap"/>
  <svg y="100%" width="18" height="18" overflow="visible">
    <use href="#cap" transform="translate(18 0) rotate(180)"/>
  </svg>
  <!-- A split grip leaves the electric core visible between its mechanical fins. -->
  <svg y="50%" width="18" height="20" overflow="visible">
    <g transform="translate(0 -10)">
      <path d="M0 0h3l2 4v12l-2 4H0zm18 0h-3l-2 4v12l2 4h3Z" fill="#050b18"/>
      <path d="M3.5 1 .75 4v3.5H5V4Zm0 18L.75 16v-3.5H5V16ZM14.5 1l2.75 3v3.5H13V4Zm0 18 2.75-3v-3.5H13V16Z" fill="url(#alloy)" stroke="url(#edge)" stroke-width=".65"/>
      <path d="M1 9h4v2H1zm12 0h4v2h-4z" fill="#91d8f5"/>
      <path d="M2 5h2m-2 10h2m10-10h2m-2 10h2" stroke="#060d1c"/>
    </g>
  </svg>
</svg>
